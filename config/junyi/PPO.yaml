base_config:
  cuda_visible_devices: 0
  data_path: ./data/processed_data/junyi/junyi_processed.csv
  max_length: 200
  max_episodes: 5000
  wandb_project: EduRec-RL-Experiments-V0712
  wandb_tags: ["PPO", "ALL_JunyiDataset"]
  use_wandb: false
  agent: PPO
  eval_interval: 1
  exp_name: rct-10  
  runs: 3                   
  n_step: false           

rct-5:
  learning_pattern: rct
  max_steps: 5
  num_goals: 500
  agent_config:
    hidden_dim: 300         
    gamma: 0.98  
    beta: 0.1           
    lr: 0.00003             
    clip_epsilon: 0.3      
    ppo_epochs: 4          
    mini_batch_size: 4     
    temperature: 0.8       
    add_goal: true    

