base_config:
  cuda_visible_devices: 0
  data_path: ./data/processed_data/junyi/junyi_processed.csv
  max_length: 200
  max_episodes: 5000
  eval_interval: 1
  n_step: false
  wandb_project: EduRec-RL-Experiments-V0712
  wandb_tags: ["SASRec", "ALL_JunyiDataset"]
  use_wandb: false
  agent: SASRec
  runs: 3                  
  exp_name: revise-s20-g10    

rct-5:
  learning_pattern: rct
  max_steps: 5
  num_goals: 500
  agent_config:
    hidden_dim: 300          
    lr: 0.00001             
    n_layers: 2             
    n_heads: 2              
    dropout: 0.01           
    gamma: 0.98             
    clip_epsilon: 0.2       
    po_epochs: 4          
    mini_batch_size: 8      
    group_size: 4          
    seq_beta: 0.2           
    temperature: 0.2
    reinforcement: false  

