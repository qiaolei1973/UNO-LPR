base_config:
  cuda_visible_devices: 0
  data_path: ./data/processed_data/junyi/junyi_processed.csv
  max_length: 200
  max_episodes: 500
  wandb_project: EduRec-RL-Experiments-V0713-Pure
  wandb_tags: ["SRC ", "ALL_JunyiDataset"]     
  use_wandb: false
  agent: SRC  
  n_step: true                             
  eval_interval: 1
  exp_name: learn-s20-g10                 
  runs: 3

learn-s10-g10:
  learning_pattern: learn
  max_steps: 10
  num_goals: 10
  agent_config:
    hidden_dim: 300
    gamma: 0.98          
    lr: 0.00005
    beta: 1
    temperature: 1
    add_goal: true 
         

