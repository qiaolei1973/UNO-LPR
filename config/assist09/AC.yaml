base_config:
  cuda_visible_devices: 0
  data_path: ./data/processed_data/assist09/assist09_processed.csv
  max_length: 200
  max_episodes: 5000
  wandb_project: EduRec-RL-Experiments-V0713-Pure
  wandb_tags: ["AC", "assist09"]     
  use_wandb: false
  agent: AC                                  
  eval_interval: 1
  exp_name: rct-10 
  runs: 1


learn-s10-g10:
  learning_pattern: learn
  n_step: false
  max_steps: 10
  num_goals: 10
  agent_config:
    hidden_dim: 128       
    gamma: 0.98          
    lr: 0.00003
    beta: 0.1            
    temperature: 1
    add_goal: true      

