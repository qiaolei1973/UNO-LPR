base_config:
  cuda_visible_devices: 0
  data_path: ./data/processed_data/assist09/assist09_processed.csv
  max_length: 200
  max_episodes: 5000
  eval_interval: 1
  n_step: false
  wandb_project: EduRec-RL-Experiments-V0709
  wandb_tags: ["GRU4Rec", "assist09"]
  use_wandb: false
  runs: 1
  agent: GRU4Rec
  exp_name: rct-10


rct-5:
  learning_pattern: rct
  max_steps: 5
  num_goals: 500
  agent_config:
    hidden_dim: 128
    lr: 0.0005
    n_layers: 2
    gamma: 0.98
    clip_epsilon: 0.2
    po_epochs: 4          
    mini_batch_size: 4
    group_size: 8
    seq_beta: 0.1
    temperature: 1.0        
    reinforcement: false   # 是否启用强化学习模式

