base_config:
  cuda_visible_devices: 0
  data_path: ./data/processed_data/assist09/assist09_processed.csv
  max_length: 200
  max_episodes: 5000
  wandb_project: EduRec-RL-Experiments-V0713-Pure
  wandb_tags: ["PPO", "assist09"]
  use_wandb: false 
  agent: PPO
  eval_interval: 1
  exp_name: rct-10 
  runs: 1
  n_step: false           

rct-5:
  learning_pattern: rct
  max_steps: 10
  num_goals: 500
  agent_config:
    hidden_dim: 128         
    gamma: 0.98  
    beta: 0.1           
    lr: 0.000005            
    clip_epsilon: 0.2      
    ppo_epochs: 4          
    mini_batch_size: 5     
    temperature:  1      
    add_goal: true        

