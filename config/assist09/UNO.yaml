base_config:
  cuda_visible_devices: 0
  data_path: ./data/processed_data/assist09/assist09_processed.csv
  max_length: 200
  max_episodes: 5000
  eval_interval: 1
  n_step: false
  wandb_project: EduRec-RL-Experiments-V0709
  wandb_tags: ["UNO", "assist09"]
  use_wandb: false
  agent: UNO
  runs: 3           
  exp_name: rct-10  

rct-5:
  learning_pattern: rct
  max_steps: 5
  num_goals: 500
  agent_config:
    hidden_dim: 128        
    gamma: 0.98             
    lr: 8.0e-05            
    clip_epsilon: 0.2      
    po_epochs: 4          
    mini_batch_size: 16      
    group_size: 10
    beta: 0.1
    add_goal: true
    kt_predict: true
    seq_predict: true
    kt_beta: 0.1
    seq_beta: 0.1 
    temperature: 1
    reinforcement: true


