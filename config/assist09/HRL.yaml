base_config:
  cuda_visible_devices: 0
  data_path: ./data/processed_data/assist09/assist09_processed.csv
  max_length: 200
  max_episodes: 5000
  wandb_project: EduRec-RL-Experiments-V0712
  wandb_tags: ["HRL", "assist09"]
  use_wandb: false
  agent: HRL
  eval_interval: 1
  exp_name: rct-10 
  runs: 1                
  n_step: false     


rct-5:
  learning_pattern: rct
  max_steps: 5
  num_goals: 500
  agent_config:
    hidden_dim: 128         
    gamma: 0.98  
    lr: 0.00003             
    clip_epsilon: 0.2       
    ppo_epochs: 4           
    mini_batch_size: 8     
    max_sub_step: 5         
    emb_cons_num: 10        
    candidates_method: embeddig  
    graph_path: ./data/processed_data/assist09/prerequest_graph.gexf
    graph_embedding_path: ./data/processed_data/assist09/GraphEmbeddings.npy  


